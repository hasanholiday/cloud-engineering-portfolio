---
- name: Configure Web Server
  hosts: webservers
  become: yes

  tasks:
    - name: Install Apache
      yum:
        name: httpd
        state: present

    - name: Start Apache service
      service:
        name: httpd
        state: started
        enabled: yes

    - name: Deploy custom webpage
      copy:
        content: "<h1>Configured by Ansible by Hassan</h1>"
        dest: /var/www/html/index.html
        mode: '0644'
